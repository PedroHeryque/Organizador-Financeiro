spring.application.name=gerenciador-financas

# "local" traz a configuracao do seu Postgres; "test" desliga o MenuConsole,
# que senao le o teclado e fecha o contexto do Spring no meio do teste.
spring.profiles.active=local,test

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=false

app.limite-comprometimento=30.0
