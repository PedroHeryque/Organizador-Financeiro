spring.application.name=gerenciador-financas

# Isola os testes do perfil local/PostgreSQL. O contexto simples usa H2 em memoria;
# o teste de integracao usa o PostgreSQL do Testcontainers via @ServiceConnection.
spring.profiles.active=test

spring.security.user.name=gestor
spring.security.user.password=123456

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=false

app.limite-comprometimento=30.0
